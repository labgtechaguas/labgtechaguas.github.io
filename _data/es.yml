  # Plantillas. Marcadores: {nombre} {titulo} {profesores} {premio}
  templates:
    defensa:
      - "Como grupo felicitamos a {nombre} por su exitosa defensa de memoria, titulada «{titulo}», a cargo de {profesores}. ¡Como equipo te deseamos mucho éxito en tus siguientes proyectos!"
      - "{nombre} defendió con éxito su memoria «{titulo}», guiada por {profesores}. Todo el equipo de G-Tech celebra este cierre de etapa y le desea lo mejor en lo que viene."
      - "¡Felicitaciones, {nombre}! El trabajo «{titulo}», bajo la guía de {profesores}, cierra meses de dedicación en el laboratorio. Desde G-Tech te deseamos mucho éxito en tus próximos desafíos."
      - "Una nueva defensa en el grupo: {nombre} presentó «{titulo}», con la guía de {profesores}. Gracias por el compromiso de estos meses; el equipo te desea lo mejor en tu camino profesional."
    titulacion:
      - "Celebramos la titulación de {nombre}, que trabajó con {profesores} durante su memoria en el grupo. ¡Mucho éxito en la etapa que se abre!"
      - "{nombre} recibió su título profesional tras su paso por el grupo, junto a {profesores}. Todo el equipo de G-Tech se suma a la celebración."
    premio:
      - "Con mucho orgullo compartimos que {nombre} recibió {premio}. Un reconocimiento merecido al trabajo y al compromiso de estos años. ¡Felicitaciones de todo el equipo!"
      - "{nombre} fue distinguida con {premio}. Desde G-Tech celebramos este reconocimiento y le deseamos mucho éxito en lo que viene."
      - "Buenas noticias en el grupo: {nombre} obtuvo {premio}. Celebramos el reconocimiento a un trabajo sostenido en el tiempo."
    congreso:
      - "{nombre} presentó «{contribucion}» en el {congreso}, en {lugar}. Estas instancias son las que mantienen al grupo conectado con lo que se está haciendo afuera."
      - "El grupo estuvo presente en el {congreso}, en {lugar}: {nombre} expuso «{contribucion}»."
      - "De vuelta del {congreso} ({lugar}), donde {nombre} presentó «{contribucion}». Gracias a quienes se acercaron a conversar sobre el trabajo."
    proyecto:
      - "Adjudicado: {nombre} obtuvo financiamiento para {proyecto}. Un nuevo frente de trabajo para el grupo en los próximos años."
      - "{nombre} se adjudicó {proyecto}. El grupo suma así una línea más de trabajo con financiamiento vigente."

