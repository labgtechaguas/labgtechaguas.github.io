  join_title: "¿Quieres investigar con nosotros?"
  join_body: >-
    Buscamos estudiantes de Ingeniería Civil Química, Ambiental o afines
    interesados en tratamiento de aguas, procesos biológicos o simulación
    numérica, tanto para tesis de pregrado como para magíster y doctorado. No
    hace falta experiencia previa: sí curiosidad y ganas de meter las manos en un
    reactor o en un código.
