research:
  title: "Investigación"
  lead: >-
    Tratamos el agua subterránea con bacterias que respiran nitrato usando azufre
    elemental como donor de electrones. Alrededor de ese proceso se organizan
    nuestras tres líneas.
  keywords: "Palabras clave"

