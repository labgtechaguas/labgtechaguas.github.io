home:
  hero_kicker: "Universidad de los Andes · Santiago, Chile"
  hero_title: "El nitrato se va; la pregunta es cómo"
  hero_lead: >-
    Un tercio del planeta bebe agua subterránea, y el nitrato es su contaminante
    más común. Estudiamos cómo tratarla con bacterias y azufre elemental: qué
    ocurre dentro del reactor, qué pasa con los microcontaminantes que vienen
    junto al nitrato, y cuánto óxido nitroso se escapa en el camino.
  hero_cta_research: "Ver líneas de investigación"
  hero_cta_team: "Conocer al equipo"

  about_kicker: "Quiénes somos"
  about_title: "Un grupo entre el reactor y el modelo"
  about_body: >-
    G-Tech es un grupo de investigación de la Facultad de Ingeniería y Ciencias
    Aplicadas de la Universidad de los Andes, dentro de la línea de Ingeniería de
    Procesos Ambientales. Trabajamos en el tratamiento biológico de aguas
    contaminadas con una idea fija: un proceso que no se entiende no se puede
    escalar.


    Eso nos obliga a movernos en dos frentes a la vez. En el laboratorio operamos
    reactores de desnitrificación autótrofa —SBR y biofiltros de lecho empacado
    con azufre elemental— y medimos lo que entra, lo que sale y lo que se emite.
    En el computador reconstruimos esos mismos reactores con dinámica de fluidos
    computacional, tomografía y modelación cinética, para explicar por qué rinden
    lo que rinden.

