home:
  hero_kicker: "Universidad de los Andes · Santiago, Chile"
  hero_title: "Nitrate can be removed; the question is how"
  hero_lead: >-
    A third of the planet drinks groundwater, and nitrate is its most common
    pollutant. We study how to treat it with bacteria and elemental sulfur: what
    happens inside the reactor, what becomes of the micropollutants that travel
    with the nitrate, and how much nitrous oxide escapes along the way.
  hero_cta_research: "See our research lines"
  hero_cta_team: "Meet the team"

  about_kicker: "Who we are"
  about_title: "A group between the reactor and the model"
  about_body: >-
    G-Tech is a research group at the Faculty of Engineering and Applied Sciences,
    Universidad de los Andes, within the Environmental Process Engineering
    research line. We work on the biological treatment of contaminated water with
    one fixed idea: a process you do not understand cannot be scaled up.


    That forces us to work on two fronts at once. In the lab we run autotrophic
    denitrification reactors — SBRs and sulfur-packed biofilters — and measure
    what goes in, what comes out and what is emitted. On the computer we rebuild
    those same reactors with computational fluid dynamics, tomography and kinetic
    modelling, to explain why they perform the way they do.

  metrics_title: "In numbers"
  metric_people: "Researchers"
  metric_projects: "Active projects"
  metric_publications: "Featured papers"
  metric_founded: "Since"

