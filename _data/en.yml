  join_title: "Want to do research with us?"
  join_body: >-
    We are looking for students in chemical, environmental or related engineering
    with an interest in water treatment, biological processes or numerical
    simulation — for undergraduate theses as well as master's and doctoral work.
    No prior experience needed: curiosity and a willingness to get your hands on
    a reactor or a codebase are enough.
