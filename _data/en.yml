home:
  hero_kicker: "Universidad de los Andes · Santiago, Chile"
  hero_title: "What if water treatment were more efficient at its source?"
  hero_lead: >-
    A third of the planet drinks groundwater, and in Chile four in ten urban areas
    — and three in four rural ones — depend on it. We work on the biological
    processes that make treating it better, and on recovering the nitrogen,
    phosphorus and energy that are lost along the way.
  hero_cta_research: "See our research lines"
  hero_cta_team: "Meet the team"

  about_kicker: "Who we are"
  about_title: "Treating water and recovering what it carries"
  about_body: >-
    G-Tech is a research group at the Faculty of Engineering and Applied Sciences,
    Universidad de los Andes, within the Environmental Process Engineering
    research line. We put microorganisms to work in reactors to treat water and
    waste, and study what happens inside them precisely enough to take it to real
    scale.


    The scope runs from groundwater contaminated with nitrate and pharmaceutical
    residues, to the sludge leaving treatment plants and the reject streams of
    desalination. In every case the same question returns: how to treat using less
    energy, and how to recover the nitrogen, phosphorus, sulfur and biogas that
    are discarded today.


    We move on two fronts at once — reactors in the lab and computational
    simulation — because a process you do not understand cannot be scaled up.

