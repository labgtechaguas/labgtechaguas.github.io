- id: cristobal-gallardo
  group: staff
  name: "Cristóbal Gallardo Balladares"
  photo: "cristobal-gallardo.jpg"
  role:
    es: "Jefe de laboratorio"
    en: "Lab manager"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Ingeniero Civil Químico, Universidad de Santiago de Chile"
    en: "Chemical Civil Engineer, Universidad de Santiago de Chile"
  bio:
    es: >-
      En el CORFO de electrocoagulación está a cargo del sistema piloto que trata
      residuos líquidos industriales y salmueras, desde su diseño y montaje hasta la
      operación diaria. En el FONDEF de deshidratación de lodos coordina el proyecto:
      el cronograma, los recursos y el enlace con la empresa asociada. Aporta al grupo
      el escalamiento y la puesta en marcha —es quien lleva un proceso del ensayo de
      laboratorio al equipo que funciona— y sostiene la infraestructura de la que
      dependen todas las líneas: los análisis fisicoquímicos, los equipos y reactivos
      de cada proyecto, y la formación de estudiantes e investigadores en métodos
      analíticos y buenas prácticas de laboratorio.
    en: >-
      In the CORFO electrocoagulation project he is responsible for the pilot system
      treating industrial wastewater and brines, from its design and assembly through
      to daily operation. In the FONDEF sludge-dewatering project he coordinates the
      work: the schedule, the resources and the liaison with the partner company. He
      brings the group scale-up and commissioning —he is the one who takes a process
      from a laboratory trial to equipment that runs— and sustains the infrastructure
      every research line depends on: the physicochemical analyses, the equipment and
      reagents of each project, and the training of students and researchers in
      analytical methods and good laboratory practice.
  interests:
    es: ["Electrocoagulación", "Precipitación química", "Tratamiento de RIL y salmueras", "Plantas piloto", "Gestión de laboratorio"]
    en: ["Electrocoagulation", "Chemical precipitation", "Industrial wastewater and brine treatment", "Pilot plants", "Laboratory management"]
  links:
    email: ""
    orcid: ""
    linkedin: ""

- id: karina-roa
  group: staff
  name: "Karina Roa Ruiz"
  photo: "karina-roa.jpg"
  role:
    es: "Ingeniera de proyectos"
    en: "Project engineer"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctora en Ciencias de la Ingeniería, mención Ciencia e Ingeniería de Materiales, Universidad de Santiago de Chile · Magíster, Universidad Tecnológica Metropolitana · Ingeniera Civil Química, Universidad de Santiago de Chile"
    en: "PhD in Engineering Sciences (Materials Science and Engineering), Universidad de Santiago de Chile · Master's degree, Universidad Tecnológica Metropolitana · Chemical Civil Engineer, Universidad de Santiago de Chile"
  bio:
    es: >-
      En el FONDEF de deshidratación de lodos evalúa estrategias de pretratamiento y
      microaireación de lodos secundarios: mide cómo afectan la deshidratación del
      lodo, sus propiedades fisicoquímicas y la liberación de materia orgánica,
      nitrógeno y fósforo hacia el líquido de filtrado. Combina el seguimiento de
      variables operacionales con la caracterización química y el análisis de
      desempeño, y con eso va ajustando las condiciones del proceso. Aporta al grupo
      su formación en ciencia e ingeniería de materiales y en ingeniería química, que
      sostiene la caracterización fisicoquímica de los lodos.
    en: >-
      In the FONDEF sludge-dewatering project she evaluates pretreatment and
      micro-aeration strategies for secondary sludge: she measures how they affect the
      dewatering of the sludge, its physicochemical properties and the release of
      organic matter, nitrogen and phosphorus into the filtrate. She combines the
      monitoring of operational variables with chemical characterisation and
      performance analysis, and uses that to adjust the process conditions. She brings
      the group her background in materials science and engineering and in chemical
      engineering, which underpins the physicochemical characterisation of the
      sludge.
  interests:
    es: ["Microaireación de lodos", "Deshidratación de lodos", "Tratamiento de aguas residuales", "Nitrógeno y fósforo", "Caracterización fisicoquímica"]
    en: ["Sludge micro-aeration", "Sludge dewatering", "Wastewater treatment", "Nitrogen and phosphorus", "Physicochemical characterisation"]
  metrics:
    publications: 25
    h_index: 13
    citations: 583
