    en: "Group director · Associate Professor"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctor en Ciencias de la Ingeniería, mención Ingeniería Química, Universidad de Concepción · Ingeniero Civil Industrial, Universidad de La Frontera"
    en: "PhD in Engineering Sciences (Chemical Engineering), Universidad de Concepción · Industrial Civil Engineer, Universidad de La Frontera"
  bio:
    es: >-
      Profesor Asociado de la Facultad de Ingeniería y Ciencias Aplicadas de la
      Universidad de los Andes, director de G-Tech y del Doctorado en Ciencias de
      la Ingeniería. Doctor en Ciencias de la Ingeniería por la Universidad de
      Concepción, con postdoctorado en la
      Technische Universität Berlin. Desde hace dos décadas trabaja en el
      tratamiento biológico de aguas y residuos, y en la modelación matemática de
      los bioprocesos que lo hacen posible: digestión anaerobia, nitrificación y
      desnitrificación, biosecado de lodos y valorización de residuos orgánicos.
      Ha dirigido dos proyectos Fondecyt y dos Fondef, participado como
      coinvestigador en otros seis Fondecyt, y guiado más de cuarenta tesis de
      pregrado, doce de magíster y cinco doctorados.
    en: >-
      Associate Professor at the Faculty of Engineering and Applied Sciences,
      Universidad de los Andes, director of G-Tech and of the PhD programme in
      Engineering Sciences. He holds a PhD in Engineering Sciences from
      Universidad de Concepción and completed a
      postdoctoral fellowship at Technische Universität Berlin. For two decades he
      has worked on the biological treatment of water and waste, and on the
      mathematical modelling of the bioprocesses behind it: anaerobic digestion,
      nitrification and denitrification, sludge biodrying and organic-waste
      valorisation. He has led two Fondecyt and two Fondef projects, co-investigated
      six further Fondecyt grants, and supervised more than forty undergraduate
      theses, twelve master's theses and five doctorates.
  interests:
    es: ["Digestión anaerobia", "Desnitrificación autótrofa", "Modelación de bioprocesos", "Zeolita natural", "Economía circular del agua"]
    en: ["Anaerobic digestion", "Autotrophic denitrification", "Bioprocess modelling", "Natural zeolite", "Circular water economy"]
