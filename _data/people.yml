- id: felipe-carreno
  group: postdoc
  name: "Felipe A. Carreño López"
  photo: "felipe-carreno.jpg"
  role:
    es: "Investigador Postdoctoral"
    en: "Postdoctoral Researcher"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctor en Ciencias de la Ingeniería (Summa cum laude) · Ingeniero Civil Químico"
    en: "PhD in Engineering Sciences (Summa cum laude) · Chemical Engineer"
  bio:
    es: >-
      Investigador postdoctoral en la Universidad de los Andes, donde dirige el
      Fondecyt de Postdoctorado N.º 3250412. Usa dinámica de fluidos computacional
      para abrir la caja negra de los biorreactores —flujo, biopelícula,
      transporte— y convertir lo que aprende en modelos predictivos útiles para
      diseñar y operar procesos reales. Ha llevado el mismo enfoque a la
      biofiltración de gases contaminantes, la biorremediación de suelos y la
      simulación multifásica de materiales cementicios, con colaboraciones en la
      University of California, Davis y la Universidad de Valladolid.
    en: >-
      Postdoctoral researcher at Universidad de los Andes, where he leads Fondecyt
      Postdoctoral grant No. 3250412. He uses computational fluid dynamics to open
      up the black box of bioreactors — flow, biofilm, transport — and turn what he
      learns into predictive models for designing and operating real processes. He
      has applied the same approach to waste-gas biofiltration, soil bioremediation
      and multiphase simulation of cementitious materials, with collaborations at
      the University of California, Davis and Universidad de Valladolid.
  interests:
    es: ["CFD y OpenFOAM", "Biopelículas en medios porosos", "Distribución de tiempos de residencia", "Acoplamiento CFD–DEM", "Gemelos digitales de reactores"]
    en: ["CFD and OpenFOAM", "Biofilms in porous media", "Residence time distributions", "CFD–DEM coupling", "Digital twins of reactors"]
