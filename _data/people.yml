- id: cristobal-gallardo
  group: staff
  name: "Cristóbal Gallardo Balladares"
  photo: "cristobal-gallardo.jpg"
  role:
    es: "Jefe de laboratorio"
    en: "Lab manager"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Ingeniero Civil Químico, Universidad de Santiago de Chile"
    en: "Chemical Civil Engineer, Universidad de Santiago de Chile"
  bio:
    es: >-
      Jefe del laboratorio de G-Tech desde 2025. Planifica, coordina y supervisa la
      operación técnica del grupo: los análisis fisicoquímicos, los equipos y reactivos
      de los proyectos, y la capacitación de estudiantes e investigadores en
      metodologías analíticas y buenas prácticas de laboratorio. Es además ingeniero de
      proyecto del CORFO de electrocoagulación, donde diseñó, montó y operó el sistema
      piloto para el tratamiento de residuos líquidos industriales y salmueras, e
      ingeniero coordinador del FONDEF de lodos, a cargo del cronograma, los recursos y
      el enlace con la empresa asociada. Antes trabajó en precipitación química para el
      tratamiento de RIL y fue jefe de laboratorio suplente en LABIOTAM, en la
      Universidad de Santiago de Chile.
    en: >-
      Head of the G-Tech laboratory since 2025. He plans, coordinates and oversees the
      group's technical operation: physicochemical analyses, the equipment and reagents
      the projects run on, and the training of students and researchers in analytical
      methods and good laboratory practice. He is also project engineer on the CORFO
      electrocoagulation grant, where he designed, built and operated the pilot system
      for treating industrial wastewater and brines, and coordinating engineer on the
      FONDEF sludge project, responsible for its schedule, resources and liaison with
      the partner company. He previously worked on chemical precipitation for industrial
      wastewater treatment and served as acting laboratory head at LABIOTAM,
      Universidad de Santiago de Chile.
  interests:
    es: ["Electrocoagulación", "Precipitación química", "Tratamiento de RIL y salmueras", "Plantas piloto", "Gestión de laboratorio"]
    en: ["Electrocoagulation", "Chemical precipitation", "Industrial wastewater and brine treatment", "Pilot plants", "Laboratory management"]
  links:
    email: ""
    orcid: ""
    linkedin: ""

- id: karina-roa
  group: staff
  name: "Karina Roa Ruiz"
  photo: "karina-roa.jpg"
  role:
    es: "Ingeniera de proyectos"
    en: "Project engineer"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctora en Ciencias de la Ingeniería, mención Ciencia e Ingeniería de Materiales · Ingeniera Civil en Química"
    en: "PhD in Engineering Sciences (Materials Science and Engineering) · Chemical Civil Engineer"
  bio:
    es: >-
      Ingeniera de proyectos del FONDEF “Nuevo proceso de pretratamiento para la
      mejora de la deshidratación de lodos secundarios y la remoción simultánea de
      N, P y materia orgánica desde el líquido de filtrado”. Su trabajo se centra en
      la evaluación de estrategias de pretratamiento y microaireación de lodos
      secundarios, analizando su efecto sobre la deshidratación, las propiedades
      fisicoquímicas del lodo y la liberación de materia orgánica, nitrógeno y
      fósforo hacia la fase líquida. Integra el seguimiento de variables
      operacionales, la caracterización química y el análisis de desempeño para
      contribuir a la optimización del proceso.
    en: >-
      Project engineer on the FONDEF IDeA I+D project “Nuevo proceso de
      pretratamiento para la mejora de la deshidratación de lodos secundarios y la
      remoción simultánea de N, P y materia orgánica desde el líquido de
      filtrado” — a new pretreatment process to improve the dewatering of secondary
      sludge and the simultaneous removal of N, P and organic matter from the
      filtrate. Her work centres on evaluating pretreatment and micro-aeration
      strategies for secondary sludge, analysing their effect on dewatering, on the
      physicochemical properties of the sludge and on the release of organic matter,
      nitrogen and phosphorus into the liquid phase. She combines the monitoring of
      operational variables, chemical characterisation and performance analysis to
      contribute to optimising the process.
  interests:
    es: ["Microaireación de lodos", "Deshidratación de lodos", "Tratamiento de aguas residuales", "Nitrógeno y fósforo", "Caracterización fisicoquímica"]
    en: ["Sludge micro-aeration", "Sludge dewatering", "Wastewater treatment", "Nitrogen and phosphorus", "Physicochemical characterisation"]
  metrics:
    publications: 25
    h_index: 13
    citations: 583
