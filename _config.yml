title: "G-Tech"
name_es: "G-Tech · Grupo de Tecnologías del Agua"
name_en: "G-Tech · Water Technologies Group"
tagline_es: "Tecnologías del agua · Universidad de los Andes"
tagline_en: "Water technologies · Universidad de los Andes"

description_es: >-
  Grupo de investigación de la Universidad de los Andes dedicado al tratamiento
  biológico de aguas contaminadas: desnitrificación autótrofa con azufre
  elemental, remoción de microcontaminantes y modelación computacional de
  biorreactores.
description_en: >-
  Research group at Universidad de los Andes working on the biological treatment
  of contaminated water: sulfur-based autotrophic denitrification, micropollutant
  removal and computational modelling of bioreactors.

url: "https://labgtechaguas.github.io"
baseurl: ""

lab:
  institution_es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
  institution_en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  line_es: "Línea de Ingeniería de Procesos Ambientales"
  line_en: "Environmental Process Engineering research line"
  city: "Santiago, Chile"
  address: "Monseñor Álvaro del Portillo 12.455, Las Condes, Santiago, Chile"
  email: "labgtechaguas@gmail.com"
  github: "labgtechaguas"
  founded: 2022

# Cifras de portada. Actualízalas cuando cambien.
metrics:
  people: 2
  projects: 2
  publications: 5

# ------------------------------------------------------------------ Jekyll ---
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/Santiago

plugins:
  - jekyll-sitemap

kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

# Carpetas de trabajo que NO deben publicarse
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache

defaults:
  - scope:
      path: ""
    values:
      lang: es
  - scope:
      path: "en"
    values:
      lang: en
