---
layout: page
---
{% assign t = site.data[page.lang] %}
<section class="section">
  <div class="wrap">
    <div class="carousel" data-carousel>
      <div class="carousel__viewport" data-track aria-roledescription="carousel" aria-label="{{ t.news.title }}" tabindex="0">
        {% for n in site.data.news %}{% include news-slide.html item=n %}{% endfor %}
      </div>

      <div class="carousel__controls">
        <button class="carousel__btn" type="button" data-prev aria-label="{{ t.news.prev }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <ol class="carousel__dots" data-dots>
          {% for n in site.data.news %}
          <li><button type="button" data-dot="{{ forloop.index0 }}" aria-label="{{ t.news.goto }} {{ forloop.index }}"></button></li>
          {% endfor %}
        </ol>
        <button class="carousel__btn" type="button" data-next aria-label="{{ t.news.next }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  document.querySelectorAll('[data-carousel]').forEach(function (car) {
    var via = car.querySelector('[data-track]');
    var slides = Array.prototype.slice.call(via.querySelectorAll('.slide'));
    var dots = Array.prototype.slice.call(car.querySelectorAll('[data-dot]'));
    var prev = car.querySelector('[data-prev]');
    var next = car.querySelector('[data-next]');
    if (!via || slides.length === 0) return;

    var actual = 0;

    function marcar(i) {
      actual = Math.max(0, Math.min(slides.length - 1, i));
      dots.forEach(function (d, j) {
        d.setAttribute('aria-current', j === actual ? 'true' : 'false');
      });
      if (prev) prev.disabled = actual === 0;
      if (next) next.disabled = actual === slides.length - 1;
    }

    function ir(i) {
      var s = slides[Math.max(0, Math.min(slides.length - 1, i))];
      if (s) via.scrollTo({ left: s.offsetLeft - via.offsetLeft, behavior: 'smooth' });
    }

    if (prev) prev.addEventListener('click', function () { ir(actual - 1); });
    if (next) next.addEventListener('click', function () { ir(actual + 1); });
    dots.forEach(function (d) {
      d.addEventListener('click', function () { ir(parseInt(d.dataset.dot, 10)); });
    });

    via.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); ir(actual + 1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); ir(actual - 1); }
    });

    if ('IntersectionObserver' in window) {
      var obs = new IntersectionObserver(function (entradas) {
        entradas.forEach(function (en) {
          if (en.isIntersecting) marcar(slides.indexOf(en.target));
        });
      }, { root: via, threshold: 0.6 });
      slides.forEach(function (s) { obs.observe(s); });
    }

    marcar(0);
  });
})();
</script>
